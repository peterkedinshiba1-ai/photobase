Release highlights
This release makes it easier to manage agent sessions, protect agent workflows, edit columnar text, and work across GitHub Enterprise instances.

Clean up worktree storage: Reclaim disk space from inactive agent session worktrees, on demand or automatically.

Cross-platform sandboxing: Limit agent access to files and network resources on Windows, macOS, and Linux with terminal sandboxing.

Arrange sessions: Compare and monitor multiple agent sessions side by side in a grid layout.

Continue external sessions: Pick up local external Copilot and Codex conversations in VS Code without losing context.

Block pasting: Paste block rows across successive lines from a single cursor.

Multiple GitHub Enterprise instances: Sign in to GHE.com and GitHub Enterprise Server accounts from the same VS Code window.

Happy Coding!

